name: Within
description: Within (Within Unlimited, Inc.) is a Los Angeles virtual-reality studio founded in 2014
  by Chris Milk and Aaron Koblin, both alumni of Google's Data Arts team. Andreessen Horowitz (a16z)
  led the company's 2016 Series A. Within builds Supernatural, a VR fitness service for Meta Quest
  headsets that pairs live human coaches with rhythm-mapped workouts set in 360-degree virtual
  locations; its earlier work spans immersive 360 video and AR (Clouds Over Sidra, Wonderscope).
  Meta Platforms acquired Within in February 2023 after the FTC's challenge to the deal failed, and
  it now operates as a Meta studio. Within is a consumer VR product company and publishes no public
  developer API, OpenAPI, SDK, or developer portal; its primary domain within.com is currently
  parked. This profile is retained as an a16z portfolio lead with no API surface to enrich.
